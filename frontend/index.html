<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 한국사 심화 퀴즈</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📚 AI 한국사 심화 퀴즈</h1>

<script src="../questions/questions.js"></script>
