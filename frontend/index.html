<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI 한국사 심화 퀴즈</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 메인 메뉴 -->
    <div id="mainMenu">

        <h1>AI 한국사 심화 퀴즈</h1>

        <p>
            한국사능력검정시험 심화 대비
        </p>

        <button id="startBtn">
            📝 랜덤 모의고사
        </button>

                <div id="settingMenu" style="display:none;">

            <h3>시험 설정</h3>


            <p>시대 선택</p>

            <select id="periodSelect">

                <option value="전체">
                    전체
                </option>

                <option value="고대">
                    고대
                </option>

                <option value="고려">
                    고려
                </option>

                <option value="조선">
                    조선
                </option>

                <option value="근현대">
                    근현대
                </option>

            </select>



            <p>분야 선택</p>

            <select id="categorySelect">

                <option value="전체">
                    전체
                </option>

                <option value="정치">
                    정치
                </option>

                <option value="경제">
                    경제
                </option>

                <option value="사회">
                    사회
                </option>

                <option value="문화">
                    문화
                </option>

            </select>



            <p>난이도</p>

            <select id="levelSelect">

                <option value="전체">
                    전체
                </option>

                <option value="중">
                    중
                </option>

                <option value="상">
                    상
                </option>

            </select>



            <p>문제 수</p>

            <select id="countSelect">

                <option value="10">
                    10문제
                </option>

                <option value="20">
                    20문제
                </option>

                <option value="50">
                    50문제
                </option>

            </select>


            <button id="settingStartBtn">
                시험 시작
            </button>


        </div>

        <button id="wrongBtn">
            📚 오답노트
        </button>

        <button id="categoryBtn">
            📖 분야별 문제
        </button>
            <div id="categoryMenu" style="display:none;">

                <h3>분야 선택</h3>

                <button class="category" data-category="고대">
                    고대사
                </button>

                <button class="category" data-category="고려">
                    고려사
                </button>

                <button class="category" data-category="조선">
                    조선사
                </button>

                <button class="category" data-category="근현대">
                    근현대사
                </button>

                <button class="category" data-category="문화">
                    문화사
                </button>

            </div>
        <button id="historyBtn">
            📊 시험 기록
        </button>

    </div>


    <!-- 퀴즈 화면 -->
    <div id="quizScreen" style="display:none;">

        <div id="progress">
            문제 1 / 10
        </div>


        <!-- 진행률 -->
        <div class="progress-box">

            <div id="progressBar"></div>

        </div>


        <!-- 문제 -->
        <h2 id="question"></h2>


        <!-- 문제 이미지 -->
        <img 
            id="questionImage"
            src=""
            alt="한국사 문제 이미지"
        >


        <!-- 보기 -->
        <div id="choices"></div>


        <!-- 정답 결과 -->
        <div id="result"></div>


        <!-- 다음 문제 -->
        <button id="nextBtn" style="display:none;">
            다음 문제
        </button>


    </div>

</div>


<script src="../questions/questions.js"></script>
<script src="app.js"></script>


</body>

</html>
