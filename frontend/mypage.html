</head>


<body>


<h1>
📊 나의 한국사 학습 대시보드

<div class="dashboard">


<div class="card">

<p>
총 응시 횟수
</p>

<h2 id="totalExam">
0
</h2>

</div>



<div class="card">

<p>
평균 점수
</p>

<h2 id="avgScore">
0%
</h2>

</div>



<div class="card">

<p>
오답 개수
</p>

<h2 id="wrongCount">
0
</h2>

</div>



<div class="card">

<p>
즐겨찾기
</p>

<h2 id="bookmarkCount">
0
</h2>

</div>


</div>



<hr>


<h2>
📈 점수 변화
</h2>


<canvas id="scoreChart"></canvas>



<hr>

⚠ 취약 시대 분석
</h2>


<div id="weakArea">

</div>



<hr>


<h2>
🤖 AI 학습 추천
</h2>


<div id="recommendArea">

</div>
<hr>

<h2>
🎯 AI 추천 문제
</h2>


<div id="recommendQuestions">

</div>
<div class="card">

<p>
나의 등급
</p>

<h2 id="userLevel">

Lv.1

</h2>

</div>


<div class="card">

<p>
학습 포인트
</p>

<h2 id="userPoint">

0

</h2>

</div>
<button id="pdfReportBtn">

📄 AI 학습 리포트 PDF

</button>
<h2>
🤖 AI 한국사 선생님
</h2>


<div id="chatArea">

</div>


<input
id="userQuestion"
placeholder="한국사 질문 입력">


<button id="askBtn">

질문하기

</button>
