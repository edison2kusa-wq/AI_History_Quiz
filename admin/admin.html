<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>
AI 한국사 관리자 문제 등록
</title>


<style>

body{

font-family:
Arial;

padding:30px;

}


input,select,textarea{

width:100%;

padding:10px;

margin:5px 0;

}


button{

padding:12px;

background:#2196F3;

color:white;

border:none;

cursor:pointer;

}

#dashboard{

display:flex;
gap:15px;
flex-wrap:wrap;
margin:20px 0;

}

.card{

width:180px;
padding:20px;
background:#2196F3;
color:white;
border-radius:10px;
text-align:center;

}

.card h3{

font-size:34px;
margin-top:10px;

}

.questionBox{

border:1px solid #ccc;
padding:10px;
margin:10px 0;
border-radius:8px;

}
</style>


</head>


<body>
    
<div id="loginArea">

<h3>
관리자 로그인
</h3>


<input id="adminEmail"
placeholder="관리자 이메일">


<input id="adminPassword"
type="password"
placeholder="비밀번호">


<button id="adminLoginBtn">
로그인
</button>


</div>


<div id="adminArea" style="display:none;">
<h2>관리자 대시보드</h2>

<div id="dashboard">

<div class="card">
총 문제
<h3 id="totalQuestion">0</h3>
</div>

<div class="card">
회원 수
<h3 id="totalUser">0</h3>
</div>

<div class="card">
시험 횟수
<h3 id="totalExam">0</h3>
</div>

<div class="card">
오답 수
<h3 id="totalWrong">0</h3>
</div>

</div>

<hr>
<h1>
관리자 문제 등록
</h1>


<input id="question"
placeholder="문제 입력">


<input id="choice1"
placeholder="보기1">


<input id="choice2"
placeholder="보기2">


<input id="choice3"
placeholder="보기3">


<input id="choice4"
placeholder="보기4">


<select id="answer">

<option value="0">
정답 1번
</option>

<option value="1">
정답 2번
</option>

<option value="2">
정답 3번
</option>

<option value="3">
정답 4번
</option>

</select>

<select id="period">

<option value="선사">
선사
</option>

<option value="고대">
고대
</option>

<option value="고려">
고려
</option>

<option value="조선">
조선
</option>

<option value="개항기">
개항기
</option>

<option value="일제강점기">
일제강점기
</option>

<option value="현대">
현대
</option>

</select>

<select id="category">

<option>
정치
</option>

<option>
경제
</option>

<option>
사회
</option>

<option>
문화
</option>


</select>



<select id="level">

<option>
중
</option>

<option>
상
</option>

</select>

<select id="type">

<option value="기출">
기출
</option>

<option value="예상">
예상
</option>

<option value="사료">
사료
</option>

<option value="자료분석">
자료분석
</option>

</select>


<input id="source" placeholder="출처 예) 한국사능력검정시험 65회">


<input id="keywords" placeholder="키워드 예) 광종, 노비안검법, 왕권강화">
<textarea id="explanation" placeholder="해설 입력"> </textarea>


<label>문제 이미지</label>

<input
type="file"
id="imageFile"
accept="image/*">

<input
id="image"
placeholder="업로드 후 URL이 자동 입력됩니다."
readonly>


<button id="saveBtn">
문제 저장
</button>
<hr>

<h2>
등록 문제 목록
</h2>


<input id="searchQuestion"
placeholder="문제 검색">
<select id="filterCategory">

    <option value="전체">
    전체 분야
    </option>

    <option value="정치">
    정치
    </option>

    <option value="경제">
    경제
    </option>

    <option value="사회">
    사회
    </option>

    <option value="문화">
    문화
    </option>

</select>
<select id="filterLevel">

    <option value="전체">
    전체 난이도
    </option>

    <option value="중">
    중
    </option>

    <option value="상">
    상
    </option>

</select>
<button id="searchBtn">
검색
</button>
<hr>

<button id="resetBtn">
전체보기
</button>

<hr>

<h2>
엑셀 문제 업로드
</h2>


<input 
type="file"
id="csvFile"
accept=".csv">


<button id="uploadCsvBtn">

CSV 업로드

</button>
<hr>

<button id="downloadCsvBtn">
CSV 다운로드
</button>
<div id="questionList"></div>

<hr>

<h2>서비스 통계</h2>

<div id="statistics"></div>

<hr>

<h2>
📊 문제 분석
</h2>


<button id="analysisBtn">

오답률 높은 문제 분석

</button>

<button id="periodAnalysisBtn">
시대별 분석
</button>



<div id="analysisResult">

</div>

<div id="pageArea">

<button id="prevPageBtn">
◀ 이전
</button>

<span id="pageInfo">
1 / 1
</span>

<button id="nextPageBtn">
다음 ▶
</button>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script src="../frontend/firebase-config.js"></script>

<script src="admin.js"></script>

</body>

</html>
