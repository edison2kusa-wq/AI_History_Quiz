<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI 한국사 심화 퀴즈</title>

    <link rel="stylesheet" href="frontend/style.css">

    <meta name="description"
content="한국사능력검정시험 심화 대비 랜덤 모의고사">


<meta property="og:title"
content="AI 한국사 심화 퀴즈">


<meta property="og:description"
content="한국사 문제은행 기반 온라인 모의시험">


<meta property="og:type"
content="website">

</head>

<body>
<div class="container">

    <button id="myHistoryBtn">
    나의 시험 기록
    </button>

<div id="myHistory"></div>

    
    <div id="mainMenu">

        <div id="loginBox">

<h3>
로그인
</h3>


<input 
id="email"
placeholder="이메일"
>


<input 
id="password"
type="password"
placeholder="비밀번호"
>


<button id="signupBtn">
회원가입
</button>


<button id="loginBtn">
로그인
</button>


<p id="loginResult"></p>


</div>


        <h1>AI 한국사 심화 퀴즈</h1>

        <p>
            한국사능력검정시험 심화 대비
        </p>

        <button id="startBtn">
            📝 랜덤 모의고사
        </button>

                <div id="settingMenu" style="display:none;">

            <h3>시험 설정</h3>


            <p>시대 선택</p>

            <select id="periodSelect">

                <option value="전체">
                    전체
                </option>

                <option value="고대">
                    고대
                </option>

                <option value="고려">
                    고려
                </option>

                <option value="조선">
                    조선
                </option>

                <option value="근현대">
                    근현대
                </option>

            </select>



            <p>분야 선택</p>

            <select id="categorySelect">

                <option value="전체">
                    전체
                </option>

                <option value="정치">
                    정치
                </option>

                <option value="경제">
                    경제
                </option>

                <option value="사회">
                    사회
                </option>

                <option value="문화">
                    문화
                </option>

            </select>



            <p>난이도</p>

            <select id="levelSelect">

                <option value="전체">
                    전체
                </option>

                <option value="중">
                    중
                </option>

                <option value="상">
                    상
                </option>

            </select>



            <p>문제 수</p>

            <select id="countSelect">

                <option value="10">
                    10문제
                </option>

                <option value="20">
                    20문제
                </option>

                <option value="50">
                    50문제
                </option>

            </select>


            <button id="settingStartBtn">
                시험 시작
            </button>


        </div>

        <button id="wrongNoteBtn">
오답노트
</button>


<div id="wrongNote"></div>
<button id="wrongQuizBtn">
오답 다시 풀기
</button>


        <button id="categoryBtn">
            📖 분야별 문제
        </button>
            <div id="categoryMenu" style="display:none;">

                <h3>분야 선택</h3>

                <button class="category" data-category="고대">
                    고대사
                </button>

                <button class="category" data-category="고려">
                    고려사
                </button>

                <button class="category" data-category="조선">
                    조선사
                </button>

                <button class="category" data-category="근현대">
                    근현대사
                </button>

                <button class="category" data-category="문화">
                    문화사
                </button>

            </div>

        <button id="aiRecommendBtn">

AI 추천 시험

</button>    
        <button id="historyBtn">
            📊 시험 기록
        </button>
        <button id="bookmarkListBtn">
⭐ 즐겨찾기
</button>

<div id="bookmarkList"></div>
       <button id="reportBtn">

학습 리포트

</button> 
<hr>
</div>
<button id="adminBtn">
관리자 문제 관리
</button>


<div id="adminMenu" style="display:none;">


<h2>
문제 등록
</h2>


<input id="adminQuestion"
placeholder="문제 내용">


<input id="choice1"
placeholder="보기1">


<input id="choice2"
placeholder="보기2">


<input id="choice3"
placeholder="보기3">


<input id="choice4"
placeholder="보기4">


<select id="adminAnswer">

<option value="0">
정답 1번
</option>

<option value="1">
정답 2번
</option>

<option value="2">
정답 3번
</option>

<option value="3">
정답 4번
</option>

</select>



<input id="adminExplain"
placeholder="해설">


<select id="adminCategory">

<option value="정치">
정치
</option>

<option value="경제">
경제
</option>

<option value="사회">
사회
</option>

<option value="문화">
문화
</option>


</select>



<select id="adminPeriod">

<option value="고대">
고대
</option>

<option value="고려">
고려
</option>

<option value="조선">
조선
</option>

<option value="근현대">
근현대
</option>

</select>



<select id="adminLevel">

<option value="중">
중
</option>

<option value="상">
상
</option>

</select>



<input id="adminImage"
placeholder="이미지 경로">


<button id="saveQuestionBtn">
문제 저장
</button>


<div id="questionList">

</div>


</div>
<div id="reportBox"></div>


    </div>


    <!-- 퀴즈 화면 -->
    <div id="quizScreen" style="display:none;">

        <div id="progress">
            <div id="timer">
    ⏰ 남은시간 : 00:00
</div>    
            문제 1 / 10
        </div>
        <div id="questionNav"></div>

        <!-- 진행률 -->
        <div class="progress-box">

            <div id="progressBar"></div>

        </div>


        <!-- 문제 -->
        <h2 id="question"></h2>
       

        <!-- 문제 이미지 -->
         <img
id="questionImage"
style="
display:none;
max-width:100%;
margin:15px 0;
border-radius:10px;
">


        <!-- 보기 -->
        <div id="choices"></div>


        <!-- 정답 결과 -->
        <div id="result"></div>
       <button id="bookmarkBtn" style="display:none;">
⭐ 즐겨찾기
</button>

     <button id="prevBtn" style="display:none;">
    이전 문제
</button>

<button id="nextBtn" style="display:none;">
    다음 문제
</button>
<button id="submitBtn" style="display:none;">
시험 제출
</button>

    

</div>


<script src="questions/questions.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="frontend/firebase-config.js"></script>

<script src="frontend/app.js"></script>


</body>

</html>
