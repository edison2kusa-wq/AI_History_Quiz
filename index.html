<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
AI 한국사 심화 퀴즈
</title>


<link rel="manifest"
href="manifest.json">


<meta name="theme-color"
content="#2563eb">


<meta name="description"
content="AI 기반 한국사능력검정시험 심화 학습 앱">


<link rel="stylesheet"
href="frontend/style.css">


</head>


<body>


<div class="app-container">



<!-- =====================
상단 헤더
===================== -->


<header class="app-header">


<h1>
🏛 AI 한국사
</h1>


<p>
한국사능력검정시험 심화 학습
</p>


</header>





<!-- =====================
로그인
===================== -->


<section id="loginBox"
class="card login-card">


<h3>
🔐 로그인
</h3>


<input
id="email"
type="email"
placeholder="이메일"
>


<input
id="password"
type="password"
placeholder="비밀번호"
>


<div class="button-row">


<button id="signupBtn">

회원가입

</button>



<button id="loginBtn">

로그인

</button>


</div>


<p id="loginResult"></p>


</section>








<!-- =====================
메인 홈
===================== -->


<section id="mainMenu">



<div class="welcome-card card">


<h2>
오늘의 한국사 학습
</h2>


<p>
AI가 나의 부족한 부분을 분석합니다.
</p>


<div class="stats">


<div>
⭐
<br>
학습점수
<br>
<span>
-
</span>
</div>


<div>
🔥
<br>
연속학습
<br>
<span>
-
</span>
</div>


<div>
🎯
<br>
취약분야
<br>
<span>
분석중
</span>
</div>


</div>


</div>







<!-- =====================
핵심 학습 버튼
===================== -->


<div class="menu-grid">



<button id="startBtn"
class="menu-card">


<div>
📝
</div>

<strong>
실전 모의고사
</strong>


<span>
시험처럼 풀기
</span>


</button>





<button id="aiRecommendBtn"
class="menu-card">


<div>
🤖
</div>


<strong>
AI 추천 시험
</strong>


<span>
맞춤 문제 출제
</span>


</button>





<button id="wrongNoteBtn"
class="menu-card">


<div>
📒
</div>


<strong>
오답노트
</strong>


<span>
틀린 문제 복습
</span>


</button>





<button id="reportBtn"
class="menu-card">


<div>
📊
</div>


<strong>
학습 분석
</strong>


<span>
성장 확인
</span>


</button>



</div>

<!-- =====================
AI 결과 영역
===================== -->


<div id="aiResultBox"
class="card">


</div>





<!-- =====================
학습 기록
===================== -->


<div class="menu-grid">


<button id="historyBtn"
class="menu-card">


<div>
📚
</div>


<strong>
시험 기록
</strong>


<span>
나의 기록 확인
</span>


</button>



<button id="myHistoryBtn"
class="menu-card">


<div>
📋
</div>


<strong>
나의 기록
</strong>


<span>
성적 보기
</span>


</button>


</div>



<div id="myHistory"
class="card">


</div>





<!-- =====================
취약 분석
===================== -->


<button id="weakBtn"
class="wide-btn">


🎯 취약 분야 분석

</button>


<div id="weakAnalysis"
class="card">

</div>






<!-- =====================
분야별 학습
===================== -->


<button id="categoryBtn"
class="wide-btn">


📖 분야별 문제

</button>




<div id="categoryMenu"
class="card"
style="display:none;">


<h3>
시대 선택
</h3>



<button class="category"
data-category="고대">

고대사

</button>



<button class="category"
data-category="고려">

고려사

</button>



<button class="category"
data-category="조선">

조선사

</button>



<button class="category"
data-category="근현대">

근현대사

</button>



<button class="category"
data-category="문화">

문화사

</button>



</div>





<!-- =====================
즐겨찾기
===================== -->


<button id="bookmarkListBtn"
class="wide-btn">


⭐ 즐겨찾기

</button>



<div id="bookmarkList"
class="card">


</div>







<!-- =====================
오답 다시 풀기
===================== -->


<button id="wrongQuizBtn"
class="wide-btn">


🔄 오답 다시 풀기

</button>






<!-- =====================
리포트
===================== -->


<div id="reportBox"
class="card">


</div>



<div id="reportCharts"
class="card">


<h3>
📈 학습 성장 그래프
</h3>



<canvas id="scoreChart">

</canvas>



<canvas id="correctWrongChart">

</canvas>



<canvas id="categoryChart">

</canvas>



</div>







<!-- =====================
시험 설정
===================== -->


<div id="settingMenu"
class="card"
style="display:none;">


<h3>
시험 설정
</h3>



<label>

시대

</label>


<select id="periodSelect">


<option value="전체">
전체
</option>


<option value="고대">
고대
</option>


<option value="고려">
고려
</option>


<option value="조선">
조선
</option>


<option value="근현대">
근현대
</option>


</select>




<label>

분야

</label>


<select id="categorySelect">


<option value="전체">
전체
</option>


<option value="정치">
정치
</option>


<option value="경제">
경제
</option>


<option value="사회">
사회
</option>


<option value="문화">
문화
</option>


</select>





<label>

난이도

</label>


<select id="levelSelect">


<option value="전체">
전체
</option>


<option value="중">
중
</option>


<option value="상">
상
</option>


</select>





<label>

문제 수

</label>


<select id="countSelect">


<option value="10">
10문제
</option>


<option value="20">
20문제
</option>


<option value="50">
50문제
</option>


</select>





<button id="settingStartBtn"
class="primary-btn">


시험 시작


</button>



</div>





</section>
<!-- mainMenu 종료 -->







<!-- =====================
퀴즈 화면
===================== -->


<section id="quizScreen"
style="display:none;">


<div class="quiz-header">

<div id="timer">
⏰ 남은시간 : 00:00
</div>

</div>



<div id="questionNav">

</div>



<div class="progress-box">

<div id="progressBar">

</div>

</div>




<div class="card">


<h2 id="question">

문제 영역

</h2>



<img 
id="questionImage"
style="
display:none;
max-width:100%;
"
>




<div id="choices">

</div>


</div>




<div id="result"
class="card">

</div>



<button id="bookmarkBtn"
style="display:none;">

⭐ 즐겨찾기

</button>



<button id="prevBtn"
style="display:none;">

이전

</button>



<button id="nextBtn"
style="display:none;">

다음

</button>



<button id="submitBtn"
style="display:none;">

제출

</button>


</section>

<!-- =====================
관리자
===================== -->


<button id="adminBtn"
style="display:none;"
class="wide-btn">


⚙ 관리자 문제 관리


</button>






</div>
<!-- app-container 종료 -->








<!-- =====================
Firebase
===================== -->


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>








<!-- =====================
Chart
===================== -->


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>








<!-- =====================
프로그램 파일
===================== -->


<script src="frontend/firebase-config.js"></script>


<script src="questions/questions.js"></script>



<script src="frontend/utils.js"></script>


<script src="frontend/auth.js"></script>


<script src="frontend/analysis.js"></script>


<script src="frontend/quiz.js"></script>


<script src="frontend/history.js"></script>


<script src="frontend/bookmark.js"></script>


<script src="frontend/wrongnote.js"></script>


<script src="frontend/report.js"></script>


<script src="frontend/ai.js"></script>


<script src="frontend/app.js"></script>







<script>


// PWA Service Worker 등록


if(
"serviceWorker" in navigator
){


window.addEventListener(
"load",
function(){


navigator.serviceWorker
.register(
"service-worker.js"
)


.then(
function(){

console.log(
"Service Worker 등록 완료"
);

}

)


.catch(
function(err){

console.log(
"Service Worker 오류",
err
);

}

);


});


}



</script>






</body>

</html>
