            <b>›</b>

<!-- ==================================================
     앱 네비게이션
================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const navButtons =
            document.querySelectorAll(
                ".nav-btn"
            );


        navButtons.forEach(
            function(btn){

                btn.addEventListener(
                    "click",
                    function(){

                        const target =
                            btn.dataset.target;


                        navButtons.forEach(
                            function(b){

                                b.classList.remove(
                                    "active"
                                );

                            }
                        );


                        btn.classList.add(
                            "active"
                        );


                        if(target === "home"){

                            showHomeScreen();

                        }


                        if(target === "study"){

                            const categoryBtn =
                                document.getElementById(
                                    "categoryBtn"
                                );

                            if(categoryBtn){

                                categoryBtn.click();

                            }

                        }


                        if(target === "ai"){

                            const aiBtn =
                                document.getElementById(
                                    "aiRecommendBtn"
                                );

                            if(aiBtn){

                                aiBtn.click();

                            }

                        }


                        if(target === "report"){

                            const reportBtn =
                                document.getElementById(
                                    "reportBtn"
                                );

                            if(reportBtn){

                                reportBtn.click();

                            }

                        }

                    }
                );

            }
        );


        function showHomeScreen(){

            const main =
                document.getElementById(
                    "mainMenu"
                );

            const quiz =
                document.getElementById(
                    "quizScreen"
                );


            if(main){

                main.style.display =
                    "block";

            }


            if(quiz){

                quiz.style.display =
                    "none";

            }

            window.scrollTo(
                0,
                0
            );

        }

    }
);

</script>



<!-- ==================================================
     Service Worker
================================================== -->

<script>

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "service-worker.js"
                )
                .then(
                    function(){

                        console.log(
                            "Service Worker 등록 완료"
                        );

                    }
                )
                .catch(
                    function(error){

                        console.warn(
                            "Service Worker 등록 실패:",
                            error
                        );

                    }
                );

        }
    );

}

</script>
