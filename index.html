<!-- ==================================================
     앱 화면 전환
================================================== -->

<script>

function showAppScreen(screenName) {

    const screens =
        document.querySelectorAll(".app-screen");

    screens.forEach(function(screen) {

        screen.classList.remove("active");

    });


    const target =
        document.getElementById(
            screenName + "Screen"
        );


    if(target) {

        target.classList.add("active");

    }


    const navItems =
        document.querySelectorAll(
            ".nav-item"
        );


    navItems.forEach(function(item) {

        item.classList.remove("active");

    });


    const navMap = {

        home: 0,

        study: 1,

        ai: 2,

        report: 3

    };


    if(navMap[screenName] !== undefined) {

        navItems[
            navMap[screenName]
        ].classList.add("active");

    }

}


/* 시험 설정 화면 */

function showSettingScreen() {

    showAppScreen("setting");

}


/* 기존 startBtn과 연결 */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const startBtn =
            document.getElementById(
                "startBtn"
            );


        if(startBtn) {

            startBtn.addEventListener(
                "click",
                function() {

                    showSettingScreen();

                }
            );

        }


        /* AI 화면에서도 기존 함수 사용 */

        const aiBtn =
            document.getElementById(
                "aiRecommendBtn2"
            );


        if(aiBtn) {

            aiBtn.addEventListener(
                "click",
                function() {

                    startAIRecommend();

                }
            );

        }

    }
);

</script>
