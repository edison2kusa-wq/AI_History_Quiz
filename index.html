<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
AI 한국사 심화 퀴즈
</title>


<meta name="description"
content="한국사능력검정시험 심화 대비 AI 문제은행">


<link rel="manifest"
href="manifest.json">


<meta name="theme-color"
content="#2563eb">


<link rel="stylesheet"
href="frontend/style.css">


</head>


<body>


<div class="app-container">



<!-- ==========================
헤더
========================== -->

<header class="app-header">


<h1>
🏛 AI 한국사 심화 퀴즈
</h1>


<p>
한국사능력검정시험 심화 대비 AI 학습 플랫폼
</p>


</header>





<!-- ==========================
로그인
========================== -->


<section id="loginBox"
class="login-card">


<h3>
🔐 로그인
</h3>



<input
id="email"
type="email"
placeholder="이메일"
>



<input
id="password"
type="password"
placeholder="비밀번호"
>



<div class="login-buttons">


<button id="signupBtn">

회원가입

</button>


<button id="loginBtn">

로그인

</button>


</div>



<p id="loginResult"></p>


</section>







<!-- ==========================
메인 메뉴
========================== -->


<section id="mainMenu">



<div class="welcome-box">


<h2>
오늘의 한국사 학습
</h2>


<p>
AI가 나의 학습 상태를 분석합니다.
</p>


</div>







<!-- ==========================
메인 카드 메뉴
========================== -->


<div class="menu-grid">





<div class="menu-card">


<h3>
📝 모의고사
</h3>


<p>
실전 시험처럼 풀기
</p>


<button id="startBtn">

시험 시작

</button>


</div>







<div class="menu-card ai-card">


<h3>
🤖 AI 추천 시험
</h3>


<p>
취약 분야 맞춤 출제
</p>


<button id="aiRecommendBtn">

AI 학습 시작

</button>


</div>





<div class="menu-card">


<h3>
📒 오답노트
</h3>


<p>
틀린 문제 다시 학습
</p>


<button id="wrongNoteBtn">

확인

</button>


</div>







<div class="menu-card">


<h3>
📊 학습 분석
</h3>


<p>
나의 성장 기록 확인
</p>


<button id="reportBtn">

분석 보기

</button>


</div>



</div>







<!-- ==========================
시험 설정
========================== -->


<div id="settingMenu"
class="setting-card"
style="display:none;">



<h3>
⚙ 시험 설정
</h3>



<label>
시대
</label>


<select id="periodSelect">


<option value="전체">
전체
</option>


<option value="고대">
고대
</option>


<option value="고려">
고려
</option>


<option value="조선">
조선
</option>


<option value="근현대">
근현대
</option>


</select>






<label>
분야
</label>


<select id="categorySelect">


<option value="전체">
전체
</option>


<option value="정치">
정치
</option>


<option value="경제">
경제
</option>


<option value="사회">
사회
</option>


<option value="문화">
문화
</option>


</select>






<label>
난이도
</label>


<select id="levelSelect">


<option value="전체">
전체
</option>


<option value="중">
중
</option>


<option value="상">
상
</option>


</select>





<label>
문제 수
</label>


<select id="countSelect">


<option value="10">
10문제
</option>


<option value="20">
20문제
</option>


<option value="50">
50문제
</option>


</select>





<button id="settingStartBtn">

시험 시작

</button>



</div>







<!-- AI 결과 -->

<div id="aiResultBox">

</div>

<!-- ==========================
학습 관리 영역
========================== -->


<section class="study-panel">



<details>


<summary>
📚 학습 관리 메뉴
</summary>



<div class="sub-menu">



<button id="historyBtn">

📊 시험 기록

</button>



<button id="myHistoryBtn">

📋 나의 학습 기록

</button>


<div id="myHistory">

</div>




<button id="weakBtn">

🎯 취약 분야 분석

</button>



<div id="weakAnalysis">

</div>





<button id="categoryBtn">

📖 분야별 문제

</button>




<div id="categoryMenu"
style="display:none;">



<h3>
분야 선택
</h3>



<button class="category"
data-category="고대">

고대사

</button>



<button class="category"
data-category="고려">

고려사

</button>



<button class="category"
data-category="조선">

조선사

</button>



<button class="category"
data-category="근현대">

근현대사

</button>



<button class="category"
data-category="문화">

문화사

</button>


</div>






<button id="bookmarkListBtn">

⭐ 즐겨찾기

</button>



<div id="bookmarkList">

</div>





<button id="wrongQuizBtn">

🔄 오답 다시 풀기

</button>



</div>



</details>


</section>









<!-- ==========================
리포트
========================== -->


<section class="report-panel">


<div id="reportBox">

</div>





<div id="reportCharts">


<h3>
📈 학습 분석 그래프
</h3>



<canvas id="scoreChart">

</canvas>



<br>


<canvas id="correctWrongChart">

</canvas>



<br>


<canvas id="categoryChart">

</canvas>



</div>


</section>







<!-- ==========================
관리자
========================== -->


<button id="adminBtn"
style="display:none;">


관리자 문제 관리


</button>






</section>
<!-- mainMenu 종료 -->









<!-- ==========================
퀴즈 화면
========================== -->


<section id="quizScreen"
style="display:none;">






<div class="quiz-header">



<div id="timer">

⏰ 남은시간 : 00:00

</div>




<div class="progress-text">

문제 진행

</div>



</div>







<!-- 문제 번호 -->

<div id="questionNav">

</div>







<!-- 진행률 -->


<div class="progress-box">


<div id="progressBar">

</div>


</div>







<!-- 문제 -->


<div class="question-card">



<h2 id="question">

</h2>







<img

id="questionImage"

style="display:none;
max-width:100%;
border-radius:15px;"

>








<!-- 보기 -->


<div id="choices">

</div>





</div>








<!-- 결과 -->


<div id="result">

</div>









<!-- 문제 이동 -->


<div class="quiz-buttons">



<button id="bookmarkBtn"
style="display:none;">


⭐ 즐겨찾기


</button>





<button id="prevBtn"
style="display:none;">


◀ 이전


</button>





<button id="nextBtn"
style="display:none;">


다음 ▶


</button>





<button id="submitBtn"
style="display:none;">


시험 제출


</button>




</div>






</section>
<!-- ==========================
Firebase SDK
========================== -->


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>







<!-- ==========================
문제 데이터
========================== -->


<script src="questions/questions.js"></script>







<!-- Chart
========================== -->


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>







<!-- ==========================
기능 Script
========================== -->


<script src="frontend/utils.js"></script>


<script src="frontend/firebase-config.js"></script>


<script src="frontend/auth.js"></script>


<script src="frontend/analysis.js"></script>


<script src="frontend/quiz.js"></script>


<script src="frontend/history.js"></script>


<script src="frontend/bookmark.js"></script>


<script src="frontend/wrongnote.js"></script>


<script src="frontend/report.js"></script>


<script src="frontend/ai.js"></script>




<!-- 메인 실행 -->


<script src="frontend/app.js"></script>








</div>
<!-- app-container 종료 -->








<!-- ==========================
Service Worker
========================== -->


<script>


if("serviceWorker" in navigator){


window.addEventListener(
"load",
function(){


navigator.serviceWorker.register(
"service-worker.js"
)

.then(function(){

console.log(
"Service Worker 등록 완료"
);

})

.catch(function(error){

console.log(
"Service Worker 오류",
error
);

});


});


}



</script>







</body>

</html>
